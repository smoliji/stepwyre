# Example harness config — a self-contained dummy that exercises every feature
# and then terminates, so the harness can be tested end to end.
#
# Format:
#   boot: a sequence of steps run in order. Each step is a mapping with:
#     name       required string, unique. Later steps reference it as ${name.prop}.
#     script     required string. Runs under `bash -c`. Use a '|' block scalar
#                for multi-line scripts.
#     lifecycle  optional, 'oneoff' (default) or 'keepalive'.
#                - oneoff: runs to completion; any env it exports flows into
#                  the following steps.
#                - keepalive: started in the background and left running; the
#                  harness kills it on teardown. After the boot, the run lives
#                  while a keepalive lives.
#     ready      keepalive only. A mapping with a 'script' that stepwyre runs
#                every 'interval' seconds (default 1) until it exits 0; the
#                next step waits for it. After 'timeout' seconds (default 60)
#                the boot fails. 'ready: nested' waits for a sub-harness boot.
#     port       (and any other extra key) becomes a resolved prop on the step,
#                referenceable later as ${name.port}.
#
#   Token expansion inside ${...}:
#     ${FREE_PORT}     a fresh free TCP port, allocated per occurrence.
#     ${name.prop}     a prop from an earlier step (cross-step reference).
#     ${prop}          a prop resolved earlier in THIS same step.

boot:
  # Two keepalive "tunnels" stand in for real port-forwards (no gcloud here,
  # just a plain sleep). Each grabs a free port and prints it. They exit after
  # a few seconds so that the demo run terminates on its own.
  # db_tunnel takes a moment to come up; its ready probe holds the boot until
  # the marker file exists.
  - name: db_tunnel
    port: ${FREE_PORT}
    marker: /tmp/harness-db_tunnel-${port}
    lifecycle: keepalive
    ready:
      script: test -f ${marker}
      interval: 0.2
      timeout: 10
    script: |
      echo "db_tunnel warming up on ${port}"
      sleep 0.5
      touch ${marker}
      echo "db_tunnel listening on ${port}"
      sleep 3
      rm -f ${marker}

  - name: cache_tunnel
    port: ${FREE_PORT}
    lifecycle: keepalive
    script: |
      echo "cache_tunnel listening on ${port}"
      exec sleep 3

  # A oneoff step that writes a config file and exports its path. The export
  # survives into later steps because oneoff steps hand their env forward.
  - name: secrets
    script: |
      export CFG_JSON_PATH=/tmp/harness-cfg.json
      echo '{"feature":"demo","enabled":true}' > "$CFG_JSON_PATH"

  # Build the app env from the tunnel ports resolved above. localhost because
  # the keepalive tunnels forward to the local free ports.
  - name: envs
    script: |
      export SQL_HOST="localhost"
      export SQL_PORT=${db_tunnel.port}
      export REDIS_HOST="localhost"
      export REDIS_PORT=${cache_tunnel.port}

  # The "app" — proves the exported vars resolved, then exits immediately so
  # the harness runs to completion and tears the tunnels down.
  - name: app_start
    script: echo "app SQL_PORT=$SQL_PORT REDIS_PORT=$REDIS_PORT CFG=$CFG_JSON_PATH"
